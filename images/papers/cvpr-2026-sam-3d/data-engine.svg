<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="system-ui, sans-serif"><rect width="1280" height="720" fill="#f4f7fb"/><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0L12,6L0,12z" fill="#152b47"/></marker></defs>
<text x="640" y="58" font-size="34" font-weight="700" fill="#152b47" text-anchor="middle">SAM 3D data engine: model proposes, people choose</text>
<path d="M1090,170 V122 H470 V168" fill="none" stroke="#152b47" stroke-width="5" marker-end="url(#a)"/>
<text x="780" y="108" font-size="24" fill="#152b47" text-anchor="middle">improved model proposes better candidates</text>
<rect x="35" y="170" width="250" height="140" rx="16" fill="#2563eb"/><text x="160" y="222" font-size="27" font-weight="700" fill="#fff" text-anchor="middle">1. Pick object</text><text x="160" y="258" font-size="27" fill="#fff" text-anchor="middle">image + mask</text><text x="160" y="292" font-size="27" fill="#fff" text-anchor="middle">~10 s each</text>
<rect x="345" y="170" width="250" height="140" rx="16" fill="#2563eb"/><text x="470" y="222" font-size="27" font-weight="700" fill="#fff" text-anchor="middle">2. Choose best</text><text x="470" y="258" font-size="27" fill="#fff" text-anchor="middle">of 6-10 meshes</text><text x="470" y="292" font-size="27" fill="#fff" text-anchor="middle">~80 s each</text>
<rect x="655" y="170" width="250" height="140" rx="16" fill="#2563eb"/><text x="780" y="222" font-size="27" font-weight="700" fill="#fff" text-anchor="middle">3. Align to</text><text x="780" y="258" font-size="27" fill="#fff" text-anchor="middle">point cloud</text><text x="780" y="292" font-size="27" fill="#fff" text-anchor="middle">~150 s each</text>
<rect x="965" y="170" width="250" height="140" rx="16" fill="#152b47"/><text x="1090" y="222" font-size="27" font-weight="700" fill="#fff" text-anchor="middle">Retrain model</text><text x="1090" y="258" font-size="27" fill="#fff" text-anchor="middle">SFT, then DPO</text><text x="1090" y="292" font-size="27" fill="#fff" text-anchor="middle">on picks + rejects</text>
<line x1="285" y1="240" x2="345" y2="240" stroke="#152b47" stroke-width="5" marker-end="url(#a)"/>
<line x1="595" y1="240" x2="655" y2="240" stroke="#152b47" stroke-width="5" marker-end="url(#a)"/>
<line x1="905" y1="240" x2="965" y2="240" stroke="#152b47" stroke-width="5" marker-end="url(#a)"/>
<line x1="470" y1="310" x2="470" y2="378" stroke="#152b47" stroke-width="5" marker-end="url(#a)"/>
<rect x="345" y="380" width="250" height="140" rx="16" fill="#fff" stroke="#2563eb" stroke-width="4"/><text x="470" y="430" font-size="27" font-weight="700" fill="#152b47" text-anchor="middle">2.5 Artists</text><text x="470" y="466" font-size="27" fill="#152b47" text-anchor="middle">hardest cases</text><text x="470" y="500" font-size="27" fill="#152b47" text-anchor="middle">(Art-3DO)</text>
<path d="M595,450 H1090 V312" fill="none" stroke="#152b47" stroke-width="5" marker-end="url(#a)"/>
<text x="700" y="438" font-size="24" fill="#152b47">artist meshes join the SFT data</text>
<text x="640" y="592" font-size="27" font-weight="700" fill="#152b47" text-anchor="middle">Lifetime yield: 3.14M shapes, 1.23M layout samples,</text>
<text x="640" y="630" font-size="27" font-weight="700" fill="#152b47" text-anchor="middle">100K textures, 7M+ pairwise preferences</text>
<text x="640" y="690" font-size="24" fill="#152b47" text-anchor="middle">Source: SAM 3D paper, Sec. 3.2 and appendix A.5 (arXiv 2511.16624)</text></svg>
