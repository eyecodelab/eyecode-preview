<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="system-ui, sans-serif"><rect width="1280" height="720" fill="#f4f7fb"/><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0L12,6L0,12z" fill="#152b47"/></marker></defs><text x="640" y="90" font-size="38" font-weight="700" fill="#152b47" text-anchor="middle">SAM 3D: single image to 3D object</text><rect x="40" y="200" width="340" height="150" rx="16" fill="#2563eb"/><text x="210" y="268" font-size="27" fill="#fff" text-anchor="middle" font-weight="700">Image + object</text><text x="210" y="306" font-size="27" fill="#fff" text-anchor="middle" font-weight="400">mask</text><rect x="470" y="200" width="340" height="150" rx="16" fill="#2563eb"/><text x="640" y="268" font-size="27" fill="#fff" text-anchor="middle" font-weight="700">DINOv2 tokens:</text><text x="640" y="306" font-size="27" fill="#fff" text-anchor="middle" font-weight="400">crop + full image</text><rect x="900" y="200" width="340" height="150" rx="16" fill="#2563eb"/><text x="1070" y="268" font-size="27" fill="#fff" text-anchor="middle" font-weight="700">Geometry model</text><text x="1070" y="306" font-size="27" fill="#fff" text-anchor="middle" font-weight="400">coarse 64³ shape + pose</text><rect x="900" y="450" width="340" height="150" rx="16" fill="#2563eb"/><text x="1070" y="518" font-size="27" fill="#fff" text-anchor="middle" font-weight="700">Texture and</text><text x="1070" y="556" font-size="27" fill="#fff" text-anchor="middle" font-weight="400">refinement model</text><rect x="470" y="450" width="340" height="150" rx="16" fill="#2563eb"/><text x="640" y="518" font-size="27" fill="#fff" text-anchor="middle" font-weight="700">Decoders:</text><text x="640" y="556" font-size="27" fill="#fff" text-anchor="middle" font-weight="400">mesh or Gaussians</text><rect x="40" y="450" width="340" height="150" rx="16" fill="#2563eb"/><text x="210" y="518" font-size="27" fill="#fff" text-anchor="middle" font-weight="700">3D object +</text><text x="210" y="556" font-size="27" fill="#fff" text-anchor="middle" font-weight="400">layout in scene</text><line x1="380" y1="275" x2="470" y2="275" stroke="#152b47" stroke-width="5" marker-end="url(#a)"/><line x1="810" y1="275" x2="900" y2="275" stroke="#152b47" stroke-width="5" marker-end="url(#a)"/><line x1="1070" y1="350" x2="1070" y2="450" stroke="#152b47" stroke-width="5" marker-end="url(#a)"/><line x1="900" y1="525" x2="810" y2="525" stroke="#152b47" stroke-width="5" marker-end="url(#a)"/><line x1="470" y1="525" x2="380" y2="525" stroke="#152b47" stroke-width="5" marker-end="url(#a)"/><text x="640" y="660" font-size="28" fill="#152b47" text-anchor="middle">Two-stage flow matching, then decode</text></svg>