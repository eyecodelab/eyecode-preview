<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="system-ui, sans-serif">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="#152b47"/></marker></defs>
<rect width="1280" height="720" fill="#f4f7fb"/>
<text x="640" y="56" font-size="38" font-weight="700" fill="#152b47" text-anchor="middle">Planning inside NWM</text>
<rect x="40" y="110" width="360" height="140" rx="14" fill="#2563eb"/><text x="220" y="165" font-size="30" fill="#fff" text-anchor="middle">Past frames</text><text x="220" y="210" font-size="28" fill="#fff" text-anchor="middle">+ goal image</text>
<rect x="460" y="110" width="360" height="140" rx="14" fill="#2563eb"/><text x="640" y="165" font-size="30" fill="#fff" text-anchor="middle">Candidate actions</text><text x="640" y="210" font-size="28" fill="#fff" text-anchor="middle">120 from CEM</text>
<rect x="880" y="110" width="360" height="140" rx="14" fill="#2563eb"/><text x="1060" y="165" font-size="30" fill="#fff" text-anchor="middle">NWM rollout</text><text x="1060" y="210" font-size="28" fill="#fff" text-anchor="middle">8 steps of 0.25 s</text>
<rect x="880" y="330" width="360" height="140" rx="14" fill="#2563eb"/><text x="1060" y="385" font-size="30" fill="#fff" text-anchor="middle">Score final frame</text><text x="1060" y="430" font-size="28" fill="#fff" text-anchor="middle">LPIPS to goal, x3 runs</text>
<rect x="460" y="330" width="360" height="140" rx="14" fill="#2563eb"/><text x="640" y="385" font-size="30" fill="#fff" text-anchor="middle">Lowest energy</text><text x="640" y="430" font-size="28" fill="#fff" text-anchor="middle">best trajectory</text>
<path d="M400 180H454" stroke="#152b47" stroke-width="5" marker-end="url(#a)"/>
<path d="M820 180H874" stroke="#152b47" stroke-width="5" marker-end="url(#a)"/>
<path d="M1060 250V324" stroke="#152b47" stroke-width="5" marker-end="url(#a)"/>
<path d="M880 400H826" stroke="#152b47" stroke-width="5" marker-end="url(#a)"/>
<rect x="40" y="540" width="1200" height="110" rx="14" fill="#fff" stroke="#2563eb" stroke-width="3"/>
<text x="640" y="588" font-size="28" fill="#152b47" text-anchor="middle">Ranking mode: NoMaD proposes 16 or 32 trajectories instead of CEM;</text>
<text x="640" y="628" font-size="28" fill="#152b47" text-anchor="middle">NWM keeps the one whose final frame is closest to the goal</text>
<text x="640" y="695" font-size="24" fill="#152b47" text-anchor="middle">EyeCode illustration of Sec. 3.3 and Appendix 7 (arXiv 2412.03572)</text>
