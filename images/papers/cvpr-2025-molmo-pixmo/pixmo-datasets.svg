<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="system-ui, sans-serif">
<rect width="1280" height="720" fill="#f4f7fb"/>
<text x="640" y="52" font-size="36" font-weight="700" fill="#152b47" text-anchor="middle">PixMo: seven datasets, no VLM used (EyeCode)</text>
<rect x="40" y="100" width="580" height="110" rx="14" fill="#2563eb"/><text x="64" y="146" font-size="32" font-weight="700" fill="#fff">PixMo-Cap</text><text x="64" y="188" font-size="28" fill="#fff">712k images, 1.3M transcripts</text>
<rect x="40" y="230" width="580" height="110" rx="14" fill="#2563eb"/><text x="64" y="276" font-size="32" font-weight="700" fill="#fff">PixMo-AskModelAnything</text><text x="64" y="318" font-size="28" fill="#fff">162k QA on 73k images</text>
<rect x="40" y="360" width="580" height="110" rx="14" fill="#2563eb"/><text x="64" y="406" font-size="32" font-weight="700" fill="#fff">PixMo-Points</text><text x="64" y="448" font-size="28" fill="#fff">2.3M pairs, 223k images</text>
<rect x="660" y="100" width="580" height="110" rx="14" fill="#152b47"/><text x="684" y="146" font-size="32" font-weight="700" fill="#fff">PixMo-CapQA</text><text x="684" y="188" font-size="28" fill="#fff">214k QA, 165k images</text>
<rect x="660" y="230" width="580" height="110" rx="14" fill="#152b47"/><text x="684" y="276" font-size="32" font-weight="700" fill="#fff">PixMo-Docs</text><text x="684" y="318" font-size="28" fill="#fff">255k images, 2.3M QA</text>
<rect x="660" y="360" width="580" height="110" rx="14" fill="#152b47"/><text x="684" y="406" font-size="32" font-weight="700" fill="#fff">PixMo-Clocks</text><text x="684" y="448" font-size="28" fill="#fff">826k examples</text>
<rect x="660" y="490" width="580" height="110" rx="14" fill="#152b47"/><text x="684" y="536" font-size="32" font-weight="700" fill="#fff">PixMo-Count</text><text x="684" y="578" font-size="28" fill="#fff">36k train images</text>
<text x="660" y="640" font-size="26" fill="#152b47">Blue: human-annotated. Dark: synthetic pipelines.</text>
<text x="40" y="680" font-size="26" fill="#152b47">Source: Section 3 of Molmo and PixMo (arXiv 2409.17146)</text></svg>